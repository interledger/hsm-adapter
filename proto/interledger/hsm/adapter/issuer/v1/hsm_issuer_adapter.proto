// HSM Issuer Adapter: gRPC contract for issuer-side hardware security module operations.
//
// This file defines the issuer-side interface for the HSM Adapter. Each concrete
// implementation (e.g., Atalla A1000 Payment HSM / Thales 10K) is provided by the FSP.
//
// Operations that are specific to the card issuer (as opposed to acquirer-
// or processor-side use). Scoped to CVV/CVV2/iCVV generation and verification,
// PIN verification, and EMV ARQC/ARPC processing.

syntax = "proto3";

package interledger.hsm.adapter.issuer.v1;

option go_package = "github.com/interledger/hsm-adapter/proto/interledger/hsm/adapter/issuer/v1;hsmissuerv1";

// HsmIssuerAdapterService is the issuer-side interface for the HSM Adapter.
service HsmIssuerAdapterService {
  // GenerateCvv computes CVV / CVV2 / iCVV from PAN + expiry + service code.
  rpc GenerateCvv(GenerateCvvRequest) returns (GenerateCvvResponse);

  // GeneratePin generates a new cardholder PIN (random or IBM 3624 derived),
  // returns it as an encrypted PIN block under the supplied PWK, and
  // optionally computes the PIN verification value (offset or PVV).
  rpc GeneratePin(GeneratePinRequest) returns (GeneratePinResponse);

  // ChangePin changes the cardholder PIN stored in the HSM. The new PIN is
  // supplied encrypted under the client-hsm key (PMK). The HSM returns the
  // new PIN block encrypted under the PWK for storage in issuer-api.
  rpc ChangePin(ChangePinRequest) returns (ChangePinResponse);

  // AuthoriseTransaction performs a full issuer-side card authorization in a
  // single call. The FSP owns the decision: it verifies the ARQC, optionally
  // verifies the PIN, applies business checks, decides the ARC and Auth Code,
  // and only then generates the ARPC bound to that decided ARC.
  //
  // This is the single authorization entry point. The PIN block is optional —
  // a no-PIN low-value contactless tap authorizes on ARQC + business checks
  // alone. Decline and approve paths return an ARC from the same code path.
  rpc AuthoriseTransaction(AuthoriseTransactionRequest) returns (AuthoriseTransactionResponse);

  // GenerateKeyPair generates a new asymmetric key pair (RSA or ECC) and returns the public key.
  rpc GenerateRSAKeyPair(GenerateRSAKeyPairRequest) returns (GenerateRSAKeyPairResponse);

  // GenerateEmvIccKey generates an EMV ICC chip master key (e.g. the AES
  // MK-AC / IMK-AC used for application cryptogram generation and verification)
  // inside the HSM. The key is returned as a working key encrypted under
  // the LMK/MFK, ready to be stored by issuer-api and referenced by
  rpc GenerateEmvIccKey(GenerateEmvIccKeyRequest) returns (GenerateEmvIccKeyResponse);
}

// CvvVariant distinguishes between CVV, CVV2 and iCVV.
enum CvvVariant {
  CVV_VARIANT_UNSPECIFIED = 0;
  CVV_VARIANT_CVV = 1;   // Track-2 service code as-is
  CVV_VARIANT_CVV2 = 2;  // Service code "000"
  CVV_VARIANT_ICVV = 3;  // Service code "999"
}

message GenerateCvvRequest {
  // CVK pair (CVK-A / CVK-B) under LMK
  string cvk_a_under_lmk = 1;
  string cvk_b_under_lmk = 2;
  // PAN (full).
  string pan = 3;
  // Expiry date in YYMM.
  string expiry_date = 4;
  // Track-2 service code (3 digits). For CVV2 use "000", for iCVV use "999",
  // or set the variant field and leave this empty.
  string service_code = 5;
  CvvVariant variant = 6;
}

message GenerateCvvResponse {
  // CVV value (typically 3 digits).
  string cvv = 1;
}

// ---------------------------------------------------------------------------
// Generate PIN
// ---------------------------------------------------------------------------

// PinGenerationMethod identifies the algorithm used to produce the PIN.
enum PinGenerationMethod {
  PIN_GENERATION_METHOD_UNSPECIFIED = 0;
  PIN_GENERATION_METHOD_RANDOM = 1;      // Cryptographically random PIN.
  PIN_GENERATION_METHOD_IBM_3624 = 2;    // IBM 3624 natural PIN derived from PAN.
}

message GeneratePinRequest {
  // PIN Generation Key (PGK) under LMK used to derive or encrypt the PIN.
  string pgk_under_lmk = 1;

  // PIN Working Key (PWK) under LMK; the output PIN block is encrypted under
  // this key for transport to the caller.
  string pwk_under_lmk = 2;

  // Cardholder PAN (full). Required for IBM 3624 derivation and for PIN block
  // formats that embed PAN digits (e.g. ISO 9564 format 0 / 3).
  string pan = 3;

  // Desired PIN length (4–12 digits). Ignored for IBM 3624 (length is derived).
  uint32 pin_length = 4;

  // PIN generation method.
  PinGenerationMethod method = 5;

  // IBM 3624 only: 16-digit decimalization table (hex).
  optional string decimalization_table = 6;

  // PIN Verification Key (PVK) under LMK. When set, the response includes the
  // verification value (offset or PVV) ready for card-personalisation.
  optional string pvk_under_lmk = 7;

  // VISA PVV only: 1-digit PIN Verification Key Indicator (PVKI).
  optional string pvki = 8;
}

message GeneratePinResponse {
  // Encrypted PIN block (ISO 9564) under PWK.
  bytes pin_block = 1;

  // IBM 3624 PIN offset. Populated when pvk_under_lmk was supplied and method
  // is IBM_3624.
  optional string pin_offset = 2;

  // VISA PVV. Populated when pvk_under_lmk was supplied and method is RANDOM
  // with a VISA PVV key.
  optional string pvv = 3;
}

// ---------------------------------------------------------------------------
// Change PIN
// ---------------------------------------------------------------------------

message ChangePinRequest {

  // Encrypted PIN block stored by issuer-api
  bytes valid_pin_block= 1;

  // Encrypted PIN block under client-hsm key.
  // This is the new PIN to be stored in the HSM.
  bytes pin_block_under_client_key = 2;

  // Cardholder PAN. Used by ISO 9564 PIN block formats that embed PAN digits.
  string pan = 3;
}

message ChangePinResponse {
  // New PIN block encrypted under PWK.
  bytes new_valid_pin_block = 1;
}

// ---------------------------------------------------------------------------
// Authorize transaction processing (ARQC/ARPC SRED and optional PIN)
// ---------------------------------------------------------------------------

// PinBlockFormat is the ISO 9564 format of the entered PIN block.
// Atalla cmd 32 field 2: ISO_0 = "1", ISO_3 = "8", ISO_4 = "D".
// Thales PIN block format code: ISO_0 = "01", ISO_3 = "47", ISO_4 = "48".
enum PinBlockFormat {
  PIN_BLOCK_FORMAT_UNSPECIFIED = 0;
  PIN_BLOCK_FORMAT_ISO_0 = 1; // ANSI / ISO-0 (3DES)
  PIN_BLOCK_FORMAT_ISO_1 = 2; // ISO-1
  PIN_BLOCK_FORMAT_ISO_3 = 3; // ISO-3
  PIN_BLOCK_FORMAT_ISO_4 = 4; // ISO-4 (AES)
}

// PinVerificationMethod is the issuer PIN verification method (a card
// personalisation choice, not dictated by the card scheme).
enum PinVerificationMethod {
  PIN_VERIFICATION_METHOD_UNSPECIFIED = 0;
  PIN_VERIFICATION_METHOD_VISA_PVV = 1;             // Atalla 32#3 | Thales EC/DC
  PIN_VERIFICATION_METHOD_IBM_3624_OFFSET = 2;      // Atalla 32#1 | Thales DA/DB
  PIN_VERIFICATION_METHOD_PIN_BLOCK_COMPARISON = 3; // Atalla 32#8 | Thales BC/BD
}

// PinVerificationData carries the material needed to verify a cardholder PIN
// during authorization. The common fields describe the entered PIN block and
// the key it is encrypted under; the method-specific reference material (the
// stored value and its verification key) is carried in the `reference` oneof.
// The PAN is taken from the SRED TLV (PVV/offset and ISO-0/3/4 PIN blocks are
// PAN-bound).
message PinVerificationData {
  // Entered PIN block from the POS terminal, translated by merchant-api and
  // encrypted under pek_under_lmk.
  bytes entered_pin_block = 1;

  // Format of entered_pin_block; the adapter maps it to each HSM's format code.
  PinBlockFormat pin_block_format = 2;

  // PIN Encryption Key (PEK / PWK / ZPK / TPK) under LMK; encrypts
  // entered_pin_block.
  bytes pek_under_lmk = 3;

  // Verification method and its method-specific reference material.
  PinVerificationMethod method = 4;
  // At most, one can be set. Zero can also be set (optional):
  oneof reference {
    VisaPvvReference visa_pvv = 5;
    Ibm3624OffsetReference ibm_3624_offset = 6;
    PinBlockComparisonReference pin_block_comparison = 7;
  }
}

// VisaPvvReference: recompute the PVV and compare it to the stored value.
message VisaPvvReference {
  // PIN Verification Key (PVK pair) under LMK.
  bytes pvk_under_lmk = 1;

  // Stored reference PIN Verification Value (kept as a string to preserve
  // leading zeros, e.g. "0177").
  string pvv = 2;

  // PIN Verification Key Indicator (0-6).
  uint32 pvki = 3;
}

// Ibm3624OffsetReference: recompute the IBM 3624 offset and compare it.
message Ibm3624OffsetReference {
  // PIN Verification Key (PVK) under LMK.
  bytes pvk_under_lmk = 1;

  // Stored reference PIN offset.
  string offset = 2;

  // 16-hex decimalization table.
  string decimalization_table = 3;

  // Verified PIN length.
  uint32 pin_length = 4;
}

// PinBlockComparisonReference: decrypt and compare against a stored reference
// PIN block.
message PinBlockComparisonReference {
  // Stored reference PIN block.
  bytes valid_pin_block = 1;

  // PIN Block Key (PBK) under LMK; valid_pin_block is encrypted under this key.
  bytes pbk_under_lmk = 2;
}

message AuthoriseTransactionRequest {
  // Key under LMK/MFK ICC master key / IMK-AC / MDK-AC inside the HSM.
  string icc_under_lmk = 1;

  // SRED TLV: decrypted transaction data as a TLV payload. Carries the
  // transaction fields the FSP applies business checks against.
  bytes sred_tlv = 2;

  // Optional PIN verification data. When omitted, the FSP authorizes on ARQC
  // + business checks alone (e.g. a no-PIN low-value contactless tap).
  optional PinVerificationData pin = 3;
}

// CryptogramFailureReason captures structured failure detail when ARQC
// verification fails or ARPC generation cannot complete.
enum CryptogramFailureReason {
  CRYPTOGRAM_FAILURE_REASON_UNSPECIFIED = 0;
  CRYPTOGRAM_FAILURE_REASON_NONE = 1;
  CRYPTOGRAM_FAILURE_REASON_INVALID_ARQC = 2;
  CRYPTOGRAM_FAILURE_REASON_KEY_NOT_FOUND = 3;
  CRYPTOGRAM_FAILURE_REASON_INVALID_INPUT_DATA = 4;
  CRYPTOGRAM_FAILURE_REASON_UNSUPPORTED_SCHEME = 5;
}

message AuthoriseTransactionResponse {
  // Authorization Response Code, EMV tag 8A, decided by the FSP from ARQC
  // validity + PIN result + business checks. "00" approve, "05"/"55" decline.
  // Approvals and declines are returned from the same code path.
  string arc = 1;

  // Authorization Code / authorization identifier (EMV tag 89), issued by the
  // FSP. Empty on decline paths where no Auth Code is assigned.
  string auth_code = 2;

  // Raw ARPC value, generated bound to the decided ARC (ARPC method 1).
  // Not populated on decline paths that assign no approving ARPC.
  bytes arpc = 3;

  // Issuer Authentication Data, EMV tag 91. Usually ARPC alone or
  // ARPC + ARC / proprietary bytes depending on scheme.
  bytes issuer_authentication_data = 4;

  // Optional ready-to-place TLV: tag 91 + length + value.
  optional bytes issuer_authentication_data_tlv = 5;

  // True if the ARQC matched the value derived from the supplied inputs.
  bool arqc_valid = 6;

  // PIN verification result. Populated only when a PIN block was supplied;
  // unset for a no-PIN authorization.
  optional bool pin_valid = 7;

  // KCV of the key used (for verification / audit).
  string key_check_value = 8;

  // Structured failure reason; CRYPTOGRAM_FAILURE_REASON_NONE on success.
  CryptogramFailureReason failure_reason = 10;
}

// Generate key pair
// store private key encrypted under LMK and a tag generated using the pubkey
// send the public key

// ---------------------------------------------------------------------------
// Generate key pair
// ---------------------------------------------------------------------------

message GenerateRSAKeyPairRequest {
  // Public exponent for RSA (e.g., "010001" for 65537), it must be less than the value of the modulus,
  //or constant indicating the curve name for ECC (e.g., "2B81040023" for p-521).
  string public_exponent_or_curve = 2;

  // Size of the modulus in bits for RSA (e.g., 2048, 3072, 4096),
  // empty for ECC
  string size_modulus = 3;
}

message GenerateRSAKeyPairResponse {
  // Public key in AKB format.
  bytes public_key = 1;

  // Private key AKB format.
  bytes private_key = 2;

  // leftmost eight hexadecimal characters of either SHA-1 of the private key
  // or SHA-256 of the public key, depending on the key type.
  string check_digits = 3;

  // Optional key slot for the generated private key on the RSA table.
  optional string key_slot = 4;

}

// ---------------------------------------------------------------------------
// Generate EMV ICC chip key
// ---------------------------------------------------------------------------

// EmvIccKeyAlgorithm selects the cryptographic algorithm of the generated EMV
enum EmvIccKeyAlgorithm {
  EMV_ICC_KEY_ALGORITHM_UNSPECIFIED = 0;
  EMV_ICC_KEY_ALGORITHM_AES = 1;
  EMV_ICC_KEY_ALGORITHM_HMAC = 2;
}

message GenerateEmvIccKeyRequest {
  // Algorithm of the key to generate. EMV application cryptogram keys. Default AES.
  // (MK-AC / IMK-AC) are AES.
  EmvIccKeyAlgorithm algorithm = 1;
}

message GenerateEmvIccKeyResponse {
  // Generated working key in key-block format, encrypted under the LMK/MFK
  string key_under_lmk = 1;

  // Check digits of the generated key.
  string check_digits = 2;
}

